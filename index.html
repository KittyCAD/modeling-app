<!DOCTYPE html>
<html lang="en" data-zds-theme="dark">

<head>
  <meta charset="utf-8" />
  <!--
    This all-blocking CSP is replaced by the vite html-transform plugin.

    It has to be a <meta> tag because the desktop app is served over file://
    and cannot set HTTP headers.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none';">

  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="An open-source CAD modeling tool from the future by Zoo." />

  <!-- Both faces ship with the app: no network dependency, and no CSP hole. -->
  <link rel="stylesheet" href="/fonts/inter/inter.css" />
  <link rel="stylesheet" href="/fonts/source-code-pro/source-code-variable.css" />

  <title>Zoo Design Studio</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
