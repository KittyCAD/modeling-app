name: sync-branch

# This is used to sync the `staging` branch with the `main` branch to
# continuously deploy the pre-production web app to Vercel. The public-facing
# web app is synced with the `production` branch, which is updated upon
# publishing the release via the `publish-apps.yml` workflow.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  staging:
    runs-on: namespace-profile-ubuntu-2-cores

    steps:
      - uses: actions/checkout@v7.0.1
      - shell: bash
        run: |
          git checkout staging || git checkout -b staging
          git fetch origin
          git reset --hard origin/main
          git push --force origin staging
