name: Hosted face picking on Engine PR 5491
run-name: ZDS 15126 face picking on Engine 5491
on: workflow_dispatch

permissions:
  contents: read
  actions: read

jobs:
  picking:
    name: Face picking (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux Chrome
            os: namespace-profile-ubuntu-8-cores;overrides.cache-tag=modeling-app-general-v2
            script: test:e2e:web
            browser_cache: ~/.cache/ms-playwright
          - label: macOS WebKit
            os: namespace-profile-macos-8-cores
            script: test:e2e:web:webkit
            browser_cache: ~/Library/Caches/ms-playwright
          - label: Windows Chrome
            os: namespace-profile-windows-8-cores
            script: test:e2e:web
            browser_cache: ~/AppData/Local/ms-playwright
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          run-id: 43250830154
          github-token: ${{ github.token }}
          name: prepared-wasm
          path: rust/kcl-wasm-lib/pkg
      - uses: actions/download-artifact@v8
        with:
          run-id: 43250830154
          github-token: ${{ github.token }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install the WASM from ZDS 15126
        shell: bash
        run: cp rust/kcl-wasm-lib/pkg/kcl_wasm_lib_bg.wasm public/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ matrix.browser_cache }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm run playwright install --with-deps
      - name: Pick the revolved slope on pr-5491-cpu
        run: npm run ${{ matrix.script }} -- local-face-picking.spec.ts --workers=1 --retries=0 --reporter=list
        env:
          VITE_KITTYCAD_WEBSOCKET_URL: wss://api.dev.zoo.dev/ws/modeling/commands?pool=pr-5491-cpu
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
