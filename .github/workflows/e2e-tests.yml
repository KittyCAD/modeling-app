name: E2E Tests
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  viewport-diagnostic:
    runs-on: namespace-profile-macos-8-cores
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    env:
      E2E_USE_PREBUILT_APP: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: prepared-wasm
          path: prepared-wasm
          run-id: 43957438799
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: prepared-ts-rs-bindings
          path: prepared-ts-rs-bindings
          run-id: 43957438799
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: prepared-web-app
          path: build
          run-id: 43957438799
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore prepared app dependencies
        run: |
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public
          mkdir -p rust/kcl-wasm-lib/pkg rust/kcl-lib/bindings
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg
          cp -r prepared-ts-rs-bindings/* rust/kcl-lib/bindings/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm run playwright install webkit
      - name: Diagnose viewport video
        run: npm run test:e2e:web:webkit -- viewport-rendering.spec.ts zookeeper-pagination.spec.ts zookeeper.spec.ts --workers=2 --retries=0
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          TARGET: web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: viewport-video-diagnostic-${{ matrix.attempt }}
          path: playwright-report/
          include-hidden-files: true
