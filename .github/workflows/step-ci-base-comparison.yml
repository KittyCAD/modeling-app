name: STEP CI base comparison
on:
  push:
    branches: [codex/step-ci-baseline-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rust:
    name: Rust failures (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: candidate
            sha: 2d31cd1e34e585f16cff9ec96bddf058d7868852
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Record exact inputs
        run: |
          git rev-parse HEAD HEAD:rust HEAD:public/kcl-samples
          cp rust/rust-toolchain.toml ./rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - name: Measure native trim phases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/kcl-lib/src/frontend.rs')
          s = p.read_text()
          start = s.index('    async fn execute_after_edit(')
          end = s.index('\n    async fn ', start + 10)
          body = s[start:end]
          body = body.replace('        // Convert to string source', '        let phase_start = std::time::Instant::now();\n        // Convert to string source', 1)
          body = body.replace('        let outcome = ctx.run_mock(&truncated_program, &mock_config).await?;', '        let phase_parse = phase_start.elapsed();\n        let outcome = ctx.run_mock(&truncated_program, &mock_config).await?;\n        let phase_solve = phase_start.elapsed();')
          body = body.replace('        let src_delta = SourceDelta', '        let phase_feedback = phase_start.elapsed();\n        eprintln!("TRIM_PHASE delete={} vars={} parse={:?} solve={:?} feedback={:?}", is_delete, outcome.var_solutions.len(), phase_parse, phase_solve - phase_parse, phase_feedback - phase_solve);\n        let src_delta = SourceDelta')
          assert 'TRIM_PHASE' in body
          p.write_text(s[:start] + body + s[end:])
          PY
      - name: Run candidate Rust tests
        env:
          ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          ZOO_HOST: https://api.dev.zoo.dev
          RUST_MIN_STACK: 10485760000
          RUST_FILTER: test(=frontend::trim::tests::test_stress_complex_trim_line_through_many_segments)
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo nextest run --workspace --features artifact-graph --profile ci --no-fail-fast --retries 0 --success-output immediate -E "$RUST_FILTER" 2>&1 | tee ../comparison-rust.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-candidate
          path: |
            comparison-rust.log
            test-results/

