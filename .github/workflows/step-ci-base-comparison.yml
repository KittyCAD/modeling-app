name: STEP CI base comparison
on:
  push:
    branches: [codex/step-ci-baseline-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  wasm:
    name: Build candidate WASM
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 389c310e610b995ceaa35ddba9671ffa30850d97
          persist-credentials: false
      - run: |
          git rev-parse HEAD HEAD:rust
          cp rust/rust-toolchain.toml ./rust-toolchain.toml
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: taiki-e/install-action@493d7f216ecab2af0602481ce809ab2c72836fa1
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - name: Build profiling WASM with function names
        run: |
          sed -i s/--release/--profiling/ scripts/build-wasm.sh
          cat >> rust/kcl-wasm-lib/Cargo.toml <<'TOML'

          [package.metadata.wasm-pack.profile.profiling]
          wasm-opt = ['-O', '-g']
          TOML
          npm run build:wasm
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const m = new WebAssembly.Module(fs.readFileSync('public/kcl_wasm_lib_bg.wasm')); const names = WebAssembly.Module.customSections(m, 'name'); assert(names.length > 0, 'profiling WASM must retain function names'); console.log('name-section bytes', names[0].byteLength);"
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-wasm
          path: rust/kcl-wasm-lib/pkg/kcl_wasm_lib*
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings/*

  integration:
    needs: wasm
    name: Trim performance (${{ matrix.revision }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: two-cores
            runner: namespace-profile-ubuntu-2-cores
            sha: 389c310e610b995ceaa35ddba9671ffa30850d97
            wasm_run: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Record exact inputs
        run: git rev-parse HEAD HEAD:rust HEAD:src/machines/sketchSolve/tools/trimToolImpl.spec.ts HEAD:vitest.config.ts
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install WASM
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Instrument trim phases without changing assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/machines/sketchSolve/tools/trimToolImpl.spec.ts')
          s=p.read_text()
          s=s.replace('  const setProgramOutcome =', '  const setupStart = performance.now()\n  const setProgramOutcome =')
          s=s.replace("  if (setProgramOutcome.type !== 'Success')", "  console.log('[phase] set-program', kclCode.length, performance.now() - setupStart)\n  if (setProgramOutcome.type !== 'Success')")
          s=s.replace('    await onAreaSelectEndHandler(trimPoints)', "    const trimStart = performance.now()\n    await onAreaSelectEndHandler(trimPoints)\n    console.log('[phase] trim-loop', kclCode.length, performance.now() - trimStart)")
          s="import { Session } from 'node:inspector'\nimport { writeFileSync } from 'node:fs'\n"+s
          s=s.replace('    const trimStart = performance.now()', "    const profiler = new Session()\n    profiler.connect()\n    await new Promise<void>((resolve, reject) => profiler.post('Profiler.enable', err => err ? reject(err) : resolve()))\n    await new Promise<void>((resolve, reject) => profiler.post('Profiler.start', err => err ? reject(err) : resolve()))\n    const trimStart = performance.now()")
          s=s.replace("    console.log('[phase] trim-loop'", "    await new Promise<void>((resolve, reject) => profiler.post('Profiler.stop', (err, result) => { if (err) { reject(err); return }; writeFileSync('trim-' + kclCode.length + '.cpuprofile', JSON.stringify(result.profile)); resolve() }))\n    profiler.disconnect()\n    console.log('[phase] trim-loop'")
          p.write_text(s)
          PY
      - name: Profile unchanged trim workload
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          for attempt in 1; do
            xvfb-run -a npm run test:integration -- src/machines/sketchSolve/tools/trimToolImpl.spec.ts src/lib/app.spec.ts --sequence.seed=15271 --retry=0 --pool=forks 2>&1 | tee -a comparison-integration.log || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-${{ matrix.revision }}
          path: |
            comparison-integration.log
            *.cpuprofile
            test-results/
