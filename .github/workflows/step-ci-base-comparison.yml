name: STEP error scene comparison
on:
  push:
    branches: [codex/step-error-readiness-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scene:
    name: Error scene (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: exact-base
            sha: 567989c16e0873687f2e89cb11951d635d523869
            wasm_run: 44405393037
          - revision: corrected-fixture
            sha: 39b6b9b4967513069685b5dc6ac76a3356535449
            wasm_run: 44609374432
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact inputs
        run: git rev-parse HEAD HEAD:rust
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install matching WASM
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm run playwright install --with-deps
      - run: npm run tronb:vite:dev
      - name: Repeat original error assertions without retries
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          TARGET: desktop
          E2E_WORKERS: '1'
          FAIL_ON_CONSOLE_ERRORS: true
        shell: bash
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1280x960x24' -- npm run test:e2e:desktop -- e2e/playwright/projects.spec.ts --grep='when code with error first loads|with errors, it should clear the scene' --repeat-each=2 --retries=0 2>&1 | tee comparison-scene.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scene-${{ matrix.revision }}
          path: |
            comparison-scene.log
            test-results/
