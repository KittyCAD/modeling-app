name: STEP assembly base comparison
on:
  push:
    branches: [codex/step-assembly-control-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  assemblies:
    name: Assembly comparison (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: exact-base
            sha: 567989c16e0873687f2e89cb11951d635d523869
            wasm_run: 44405393037
          - revision: candidate
            sha: 84a16a4373d987beaf3cf27d880532a5d1ea10d6
            wasm_run: 44577814983
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact inputs
        run: |
          git rev-parse HEAD HEAD:rust
          git diff -- e2e/playwright/test-utils.ts
          git hash-object e2e/playwright/test-utils.ts e2e/playwright/snapshot-tests.spec.ts
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install matching WASM
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
          sha256sum public/kcl_wasm_lib_bg.wasm
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm run playwright install --with-deps
      - run: npm run tronb:vite:dev
      - name: Repeat both assembly selection paths without retries
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          TARGET: desktop
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a npx playwright test --config=playwright.electron.config.ts e2e/playwright/point-click-assemblies.spec.ts --grep='Insert the bracket part into an assembly and transform it' --workers=1 --repeat-each=2 --retries=0 2>&1 | tee comparison-assembly.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: assembly-${{ matrix.revision }}
          path: |
            comparison-assembly.log
            test-results/
