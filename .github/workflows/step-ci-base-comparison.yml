name: STEP CI base comparison
on:
  push:
    branches: [codex/step-ci-baseline-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rust:
    name: Rust failures (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: candidate
            sha: c550ae94b4aed86e04be97a9b13dee61bd690273
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Record exact inputs
        run: |
          git rev-parse HEAD HEAD:rust HEAD:public/kcl-samples
          cp rust/rust-toolchain.toml ./rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - name: Run candidate Rust tests
        env:
          ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          ZOO_HOST: https://api.dev.zoo.dev
          RUST_MIN_STACK: 10485760000
          RUST_FILTER: >-
            test(frontend::trim::) or
            test(simulation_tests::error_loft_section_order::) or
            test(=simulation_tests::kcl_samples::kcl_test_execute_tooling_nest_block) or
            test(=simulation_tests::kcl_samples::parse_tooling_nest_block) or
            test(=simulation_tests::kcl_samples::unparse_tooling_nest_block)
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo nextest run --workspace --features artifact-graph --profile ci --no-fail-fast --retries 1 -E "$RUST_FILTER" 2>&1 | tee ../comparison-rust.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-candidate
          path: |
            comparison-rust.log
            test-results/

  integration:
    name: Trim performance (${{ matrix.revision }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: two-cores
            runner: namespace-profile-ubuntu-2-cores
            sha: c550ae94b4aed86e04be97a9b13dee61bd690273
            wasm_run: 44557940519
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Record exact inputs and verify WASM source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse HEAD HEAD:rust HEAD:src/machines/sketchSolve/tools/trimToolImpl.spec.ts HEAD:vitest.config.ts
          git fetch --no-tags --depth=1 origin c65ba1836cb072cb8bad51f052a9a95045019d7d
          git diff --exit-code c65ba1836cb072cb8bad51f052a9a95045019d7d HEAD -- rust ':!rust/kcl-lib/tests'
          ready=false
          for attempt in $(seq 1 40); do
            if gh api repos/KittyCAD/modeling-app/actions/runs/${{ matrix.wasm_run }}/artifacts --jq '.artifacts[].name' | grep -qx prepared-ts-rs-bindings; then
              ready=true
              break
            fi
            sleep 15
          done
          test "$ready" = true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install WASM
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run unchanged trim and project tests
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          for attempt in 1 2 3; do
            xvfb-run -a npm run test:integration -- src/machines/sketchSolve/tools/trimToolImpl.spec.ts src/lib/app.spec.ts --sequence.seed=15271 --retry=0 --pool=forks 2>&1 | tee -a comparison-integration.log || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-${{ matrix.revision }}
          path: |
            comparison-integration.log
            test-results/
