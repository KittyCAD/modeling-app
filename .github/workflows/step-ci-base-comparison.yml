name: STEP CI base comparison
on:
  push:
    branches: [codex/step-ci-baseline-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rust:
    name: Rust failures (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: candidate
            sha: 4da8d651eecc5331690edef23ca78b8ef1647aa7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Record exact inputs
        run: |
          git rev-parse HEAD HEAD:rust HEAD:public/kcl-samples
          cp rust/rust-toolchain.toml ./rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - name: Validate binding exports serially
        run: |
          cd rust
          cargo test -p kcl-lib --features artifact-graph export_bindings -- --test-threads=1
      - name: Run candidate Rust tests
        env:
          ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          ZOO_HOST: https://api.dev.zoo.dev
          RUST_MIN_STACK: 10485760000
          RUST_FILTER: >-
            (test(frontend::) and not test(export_bindings)) or
            test(simulation_tests::error_loft_section_order::) or
            test(=simulation_tests::kcl_samples::kcl_test_execute_tooling_nest_block) or
            test(=simulation_tests::kcl_samples::parse_tooling_nest_block) or
            test(=simulation_tests::kcl_samples::unparse_tooling_nest_block)
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo nextest run --workspace --features artifact-graph --profile ci --no-fail-fast --retries 1 -E "$RUST_FILTER" 2>&1 | tee ../comparison-rust.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-candidate
          path: |
            comparison-rust.log
            test-results/

  wasm:
    name: Build candidate WASM
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4da8d651eecc5331690edef23ca78b8ef1647aa7
          persist-credentials: false
      - run: |
          git rev-parse HEAD HEAD:rust
          cp rust/rust-toolchain.toml ./rust-toolchain.toml
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: taiki-e/install-action@493d7f216ecab2af0602481ce809ab2c72836fa1
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - run: npm run build:wasm
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-wasm
          path: rust/kcl-wasm-lib/pkg/kcl_wasm_lib*
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings/*

  integration:
    needs: wasm
    name: Trim performance (${{ matrix.revision }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: two-cores
            runner: namespace-profile-ubuntu-2-cores
            sha: 4da8d651eecc5331690edef23ca78b8ef1647aa7
            wasm_run: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Record exact inputs
        run: git rev-parse HEAD HEAD:rust HEAD:src/machines/sketchSolve/tools/trimToolImpl.spec.ts HEAD:vitest.config.ts
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install WASM
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run unchanged trim and project tests
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          for attempt in 1 2 3; do
            xvfb-run -a npm run test:integration -- src/machines/sketchSolve/tools/trimToolImpl.spec.ts src/lib/app.spec.ts --sequence.seed=15271 --retry=0 --pool=forks 2>&1 | tee -a comparison-integration.log || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-${{ matrix.revision }}
          path: |
            comparison-integration.log
            test-results/
