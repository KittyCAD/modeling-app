name: STEP CI base comparison
on:
  push:
    branches: [codex/step-ci-baseline-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  snapshots:
    name: Browser snapshots (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: exact-base
            sha: 567989c16e0873687f2e89cb11951d635d523869
            wasm_run: 44405393037
          - revision: candidate
            sha: 19df7b96f3bf1d00ef7214ae21e11002536804aa
            wasm_run: 44577814983
          - revision: candidate-old-wait
            sha: 19df7b96f3bf1d00ef7214ae21e11002536804aa
            wasm_run: 44577814983
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore old helper for diagnostic control
        if: matrix.revision == 'candidate-old-wait'
        run: git show c65ba1836cb072cb8bad51f052a9a95045019d7d:e2e/playwright/test-utils.ts > e2e/playwright/test-utils.ts
      - name: Record exact inputs
        run: |
          git rev-parse HEAD HEAD:rust
          git diff -- e2e/playwright/test-utils.ts
          git hash-object e2e/playwright/test-utils.ts e2e/playwright/snapshot-tests.spec.ts
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install matching WASM
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
          sha256sum public/kcl_wasm_lib_bg.wasm
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm run playwright install --with-deps
      - name: Run unchanged browser snapshots without updating expectations
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          TARGET: web
          NODE_ENV: development
        shell: bash
        run: |
          set -o pipefail
          npm run test:snapshots -- --update-snapshots=none 2>&1 | tee comparison-snapshots.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshots-${{ matrix.revision }}
          path: |
            comparison-snapshots.log
            test-results/
