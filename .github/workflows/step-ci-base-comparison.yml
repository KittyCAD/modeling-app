name: STEP CI base comparison
on:
  push:
    branches: [codex/step-ci-baseline-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    name: Desktop failures (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: candidate
            sha: dd690349000bfd7cc2dc6c3e771a4fd2a56a97da
            wasm_run: 44561735280
            rust_tree: 4961ec36f069912e771549100236d87ff38090a3
          - revision: base
            sha: 567989c16e0873687f2e89cb11951d635d523869
            wasm_run: 44405393037
            rust_tree: 94cadb2766d69238dc870e5b616038bce4f71169
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify WASM source identity
        run: |
          git rev-parse HEAD HEAD:rust
          test "$(git rev-parse HEAD:rust)" = '${{ matrix.rust_tree }}'
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install identical WASM from verified Rust tree
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm run playwright install --with-deps
      - run: npm run tronb:vite:dev
      - name: Run candidate desktop tests
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          FAIL_ON_CONSOLE_ERRORS: true
          TARGET: desktop
          E2E_WORKERS: 1
        shell: bash
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npm run test:e2e:desktop -- --grep='Insert the bracket part into an assembly and transform it' --workers=1 --retries=0 2>&1 | tee comparison-desktop.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ matrix.revision }}
          path: |
            comparison-desktop.log
            test-results/
            playwright-report/
          include-hidden-files: true

