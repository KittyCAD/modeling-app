name: STEP CI base comparison
on:
  push:
    branches: [codex/step-ci-baseline-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rust:
    name: Rust failures (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: candidate
            sha: c65ba1836cb072cb8bad51f052a9a95045019d7d
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Record exact inputs
        run: |
          git rev-parse HEAD HEAD:rust HEAD:public/kcl-samples
          cp rust/rust-toolchain.toml ./rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - name: Run candidate Rust tests
        env:
          ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          ZOO_HOST: https://api.dev.zoo.dev
          RUST_MIN_STACK: 10485760000
          RUST_FILTER: >-
            test(frontend::trim::) or
            test(simulation_tests::error_loft_section_order::) or
            test(=simulation_tests::kcl_samples::kcl_test_execute_tooling_nest_block) or
            test(=simulation_tests::kcl_samples::parse_tooling_nest_block) or
            test(=simulation_tests::kcl_samples::unparse_tooling_nest_block)
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo nextest run --workspace --features artifact-graph --profile ci --no-fail-fast --retries 1 -E "$RUST_FILTER" 2>&1 | tee ../comparison-rust.log
      - name: Generate candidate snapshots for review
        if: always()
        env:
          ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          ZOO_HOST: https://api.dev.zoo.dev
          RUST_MIN_STACK: 10485760000
          INSTA_UPDATE: always
          ZOO_SIM_UPDATE: always
          EXPECTORATE: overwrite
          TWENTY_TWENTY: update
          RUST_FILTER: >-
            test(frontend::trim::) or
            test(simulation_tests::error_loft_section_order::) or
            test(=simulation_tests::kcl_samples::kcl_test_execute_tooling_nest_block) or
            test(=simulation_tests::kcl_samples::parse_tooling_nest_block) or
            test(=simulation_tests::kcl_samples::unparse_tooling_nest_block)
        shell: bash
        run: |
          set -o pipefail
          cd rust
          cargo nextest run --workspace --features artifact-graph --profile ci --no-fail-fast --retries 0 -E "$RUST_FILTER" 2>&1 | tee ../candidate-regeneration.log
      - name: Collect changed outputs for review
        if: always()
        run: |
          git diff --binary HEAD -- rust/kcl-lib/tests rust/kcl-lib/e2e/executor/outputs docs/kcl-std > candidate-snapshots.patch
          git diff --name-only -z HEAD -- rust/kcl-lib/tests rust/kcl-lib/e2e/executor/outputs docs/kcl-std | tar --null -T - -czf candidate-snapshots.tar.gz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-candidate
          path: |
            comparison-rust.log
            candidate-regeneration.log
            candidate-snapshots.patch
            candidate-snapshots.tar.gz
            test-results/
  python-base:
    name: Python tests (exact base, supported interpreter)
    runs-on: namespace-profile-ubuntu-8-cores
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 567989c16e0873687f2e89cb11951d635d523869
          persist-credentials: false
      - run: |
          git rev-parse HEAD
          cp rust/rust-toolchain.toml ./rust-toolchain.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v7
      - name: Run original Python suite
        env:
          UV_PYTHON: '3.13'
          ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          ZOO_HOST: https://api.dev.zoo.dev
        shell: bash
        run: |
          set -o pipefail
          cd rust/kcl-python-bindings
          uv python install 3.13
          uv venv --python 3.13
          uv pip install '.[test]'
          uv run --no-sync pytest tests/tests.py --junitxml=test-results/junit.xml 2>&1 | tee ../../comparison-python-base.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-base
          path: |
            comparison-python-base.log
            rust/kcl-python-bindings/test-results/
