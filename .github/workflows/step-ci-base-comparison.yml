name: STEP face integration comparison
on:
  push:
    branches: [codex/step-face-control-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  faces:
    name: Face integration (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-2-cores
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: exact-base
            sha: 567989c16e0873687f2e89cb11951d635d523869
            wasm_run: 44405393037
          - revision: unchanged-head
            sha: 39b6b9b4967513069685b5dc6ac76a3356535449
            wasm_run: 44613765585
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact inputs
        run: |
          git rev-parse HEAD HEAD:rust
          git hash-object src/lang/modifyAst/faces.spec.ts
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install matching WASM
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
          sha256sum public/kcl_wasm_lib_bg.wasm
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Repeat unchanged face assertions without retries
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          failed=0
          for seed in 1795122405939 15271; do
            npm run test:integration -- src/lang/modifyAst/faces.spec.ts --retry=0 --sequence.seed="$seed" --reporter=default --reporter=json --outputFile="comparison-faces-$seed.json" 2>&1 | tee "comparison-faces-$seed.log" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: faces-${{ matrix.revision }}
          path: |
            comparison-faces-*.log
            comparison-faces-*.json
