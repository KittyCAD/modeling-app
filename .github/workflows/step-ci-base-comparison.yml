name: STEP scene readiness validation
on:
  push:
    branches: [codex/step-export-readiness-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scene:
    name: Scene readiness (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: desktop
            runner: namespace-profile-macos-8-cores
          - target: web
            runner: namespace-profile-ubuntu-8-cores
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 663eac45dc455dee21d6709786e24d2cedc14976
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact inputs
        run: git rev-parse HEAD HEAD:rust
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44598041052
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 44598041052
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install matching WASM
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm run playwright install --with-deps
      - if: matrix.target == 'desktop'
        run: npm run tronb:vite:dev
      - name: Run original assertions without retries or snapshot updates
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          TARGET: ${{ matrix.target }}
          E2E_WORKERS: '1'
          FAIL_ON_CONSOLE_ERRORS: true
        shell: bash
        run: |
          set -o pipefail
          if [ "$TARGET" = desktop ]; then
            npm run test:e2e:desktop -- e2e/playwright/desktop-export.spec.ts --repeat-each=2 --retries=0 2>&1 | tee comparison-scene.log
          else
            NODE_ENV=development npm run test:snapshots -- --update-snapshots=none --retries=0 2>&1 | tee comparison-scene.log
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scene-${{ matrix.target }}
          path: |
            comparison-scene.log
            test-results/
