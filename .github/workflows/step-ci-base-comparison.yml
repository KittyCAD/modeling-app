name: STEP CI base comparison
on:
  push:
    branches: [codex/step-ci-baseline-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integration:
    name: Integration comparison (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-2-cores
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: base
            sha: 567989c16e0873687f2e89cb11951d635d523869
            wasm_run: 44405393037
          - revision: candidate
            sha: ca4eb5d263c3f0528f350e9af92f4e4695744b39
            wasm_run: 44548232352
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Record exact inputs
        run: git rev-parse HEAD HEAD:rust HEAD:src/machines/sketchSolve/tools/trimToolImpl.spec.ts HEAD:vitest.config.ts
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install WASM
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run unchanged integration suite
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a npm run test:integration -- --sequence.seed=15271 2>&1 | tee comparison-integration.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-${{ matrix.revision }}
          path: |
            comparison-integration.log
            test-results/
