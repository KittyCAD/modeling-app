name: STEP modeling test comparison
on:
  push:
    branches: [codex/step-modeling-control-20261119]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  modeling:
    name: Modeling tests (${{ matrix.revision }})
    runs-on: namespace-profile-ubuntu-2-cores
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: exact-base
            sha: 567989c16e0873687f2e89cb11951d635d523869
            wasm_run: 44405393037
          - revision: unchanged-head
            sha: ac859c5e48f10737dc0cac059e55a5b449347318
            wasm_run: 44598041052
          - revision: fixture-fix
            sha: fb75cf1fa79cf1d76d4b62cdb9ecdb4e3ae73a12
            wasm_run: 44598041052
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact inputs
        run: |
          git rev-parse HEAD HEAD:rust
          git hash-object src/machines/modelingMachine.spec.ts
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-wasm
          path: prepared-wasm
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.wasm_run }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Install matching WASM
        run: |
          mkdir -p rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg/
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public/
          sha256sum public/kcl_wasm_lib_bg.wasm
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run original failure seed and a second shuffle without retries
        env:
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          for seed in 1795116936566 15271; do
            echo "Modeling validation seed $seed"
            npm run test:integration -- --retry=0 --sequence.seed="$seed" --reporter=default --reporter=json --outputFile="comparison-$seed.json" src/machines/modelingMachine.spec.ts 2>&1 | tee -a comparison-modeling.log || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: modeling-${{ matrix.revision }}
          path: |
            comparison-modeling.log
            comparison-*.json
