name: Build Wasm

on:
  workflow_call:
    inputs:
      ref:
        description: Exact application commit; empty preserves the caller checkout
        type: string
        default: ""
      artifact-suffix:
        description: Optional namespace for independent Wasm and binding artifacts
        type: string
        default: ""
    secrets:
      TAB_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  build-wasm:
    # Keep host-user Cargo outputs separate from the root-run MUSL build.
    runs-on: namespace-profile-ubuntu-8-cores;overrides.cache-tag=modeling-app-rust-host-v2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: kittycad/modeling-app # required for 'workflow_call'
          ref: ${{ inputs.ref }}

      - uses: actions/checkout@v7.0.1
        if: ${{ inputs.artifact-suffix != '' }}
        with:
          repository: kittycad/modeling-app
          ref: ${{ github.sha }}
          path: .performance-pipeline

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use correct Rust toolchain
        shell: bash
        run: |
          [ -e rust-toolchain.toml ] || cp rust/rust-toolchain.toml ./

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false # configured below
          rustflags: "" # use .cargo/config.toml

      - name: Install Wasm pack
        uses: taiki-e/install-action@c30ba1cbe2face7f695d394a2c95af204d417b29
        with:
          tool: wasm-pack

      - name: Cache Rust artifacts
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git

      - name: Verify Rust cache is writable
        run: .github/ci-cd-scripts/verify-rust-cache-writable.sh

      - name: Build Wasm
        shell: bash
        run: |
          if [ -n "$ARTIFACT_SUFFIX" ]; then
            cargo fetch --locked --manifest-path rust/Cargo.toml
          fi
          npm run build:wasm
        env:
          ARTIFACT_SUFFIX: ${{ inputs.artifact-suffix }}

      - name: Use committed TypeScript bindings
        shell: bash
        run: |
          cp -R rust/kcl-lib/expected-bindings/ts-rs rust/kcl-lib/bindings

      - name: Copy Wasm to public
        run: |
          ls -R rust/kcl-wasm-lib/pkg
          cp rust/kcl-wasm-lib/pkg/kcl_wasm_lib_bg.wasm public

      - name: Record comparison Wasm provenance and reject lockfile drift
        if: ${{ inputs.artifact-suffix != '' }}
        run: node .performance-pipeline/e2e/performance/build-comparison.cjs wasm .

      - uses: actions/upload-artifact@v7
        with:
          name: prepared-wasm${{ inputs.artifact-suffix }}
          retention-days: 7
          path: |
            rust/kcl-wasm-lib/pkg/kcl_wasm_lib*
            rust/kcl-wasm-lib/pkg/interaction-wasm-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: prepared-ts-rs-bindings${{ inputs.artifact-suffix }}
          path: |
            rust/kcl-lib/bindings/*
