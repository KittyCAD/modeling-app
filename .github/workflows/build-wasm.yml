name: Build Wasm

on:
  workflow_call:
    secrets:
      TAB_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: namespace-profile-ubuntu-8-cores
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: kittycad/modeling-app # required for 'workflow_call'

      - id: filter
        name: Check for Rust changes
        uses: dorny/paths-filter@v4.0.3
        continue-on-error: true # this step fails when invoked as 'workflow_call'
        with:
          filters: |
            rust:
              - 'rust/**'

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Download Wasm cache
        id: download-wasm
        if: ${{ (steps.filter.outputs.rust || 'false') == 'false' }}
        uses: dawidd6/action-download-artifact@v23
        continue-on-error: true
        with:
          name: prepared-wasm
          # `build-wasm.yml` is `workflow_call` only, so its artifacts are
          # attributed to the caller's parent run. Using `e2e-tests.yml` works
          # as the canonical caller since this runs every hour on main.
          workflow: e2e-tests.yml
          branch: main
          path: rust/kcl-wasm-lib/pkg

      - name: Validate Wasm cache
        id: validate-wasm
        if: ${{ steps.download-wasm.outcome == 'success' }}
        shell: bash
        run: |
          expected_rust_tree=$(git rev-parse HEAD:rust)
          cached_rust_tree=$(cat rust/kcl-wasm-lib/pkg/kcl_wasm_lib.rust-tree 2>/dev/null || true)

          if [[ "${cached_rust_tree}" == "${expected_rust_tree}" ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Cached Wasm was built from a different Rust tree; rebuilding."
          fi

      - name: Build Wasm condition
        id: wasm
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          CACHE_VALID: ${{ steps.validate-wasm.outputs.valid || 'false' }}
          RUST_CHANGES: ${{ steps.filter.outputs.rust || 'false' }}
        run: |
          # Build Wasm with Rust changes, stale/missing caches, or for stacked PRs
          if [[ "${RUST_CHANGES}" == 'true' || \
                "${CACHE_VALID}" != 'true' || \
                ( -n "${BASE_REF}" && "${BASE_REF}" != 'main' ) ]]; then
            echo "should-build-wasm=true" >> $GITHUB_OUTPUT
          else
            echo "should-build-wasm=false" >> $GITHUB_OUTPUT
          fi

      - name: Use correct Rust toolchain
        if: ${{ steps.wasm.outputs.should-build-wasm == 'true' }}
        shell: bash
        run: |
          [ -e rust-toolchain.toml ] || cp rust/rust-toolchain.toml ./

      - name: Install Rust
        if: ${{ steps.wasm.outputs.should-build-wasm == 'true' }}
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false # configured below
          rustflags: '' # use .cargo/config.toml

      - uses: taiki-e/install-action@c30ba1cbe2face7f695d394a2c95af204d417b29
        if: ${{ steps.wasm.outputs.should-build-wasm == 'true' }}
        with:
          tool: wasm-pack

      - name: Rust cache on the Namespace volume
        if: ${{ steps.wasm.outputs.should-build-wasm == 'true' }}
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git

      - name: Build Wasm
        if: ${{ steps.wasm.outputs.should-build-wasm == 'true' }}
        shell: bash
        run: npm run build:wasm

      - name: Use committed TypeScript bindings
        if: ${{ steps.wasm.outputs.should-build-wasm != 'true' }}
        shell: bash
        run: |
          cp -R rust/kcl-lib/expected-bindings/ts-rs rust/kcl-lib/bindings

      - name: Record Wasm Rust tree
        shell: bash
        run: git rev-parse HEAD:rust > rust/kcl-wasm-lib/pkg/kcl_wasm_lib.rust-tree

      - name: Copy Wasm to public
        run: |
          ls -R rust/kcl-wasm-lib/pkg
          cp rust/kcl-wasm-lib/pkg/kcl_wasm_lib_bg.wasm public

      - uses: actions/upload-artifact@v7
        with:
          name: prepared-wasm
          retention-days: 7
          path: |
            rust/kcl-wasm-lib/pkg/kcl_wasm_lib*

      - uses: actions/upload-artifact@v7
        with:
          name: prepared-ts-rs-bindings
          path: |
            rust/kcl-lib/bindings/*
