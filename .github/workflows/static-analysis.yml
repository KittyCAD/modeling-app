name: Static Analysis

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  npm-fmt-check:
    runs-on: namespace-profile-ubuntu-2-cores
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install
      - run: npm run fmt:check

  build-wasm:
    uses: ./.github/workflows/build-wasm.yml
    secrets:
      TAB_API_KEY: ${{ secrets.TAB_API_KEY }}

  npm-tsc:
    runs-on: namespace-profile-ubuntu-2-cores
    needs: build-wasm

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Copy prepared wasm
        run: |
          ls -R prepared-wasm
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public
          mkdir rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg

      - name: Copy prepared ts-rs bindings
        run: |
          ls -R prepared-ts-rs-bindings
          mkdir rust/kcl-lib/bindings
          cp -r prepared-ts-rs-bindings/* rust/kcl-lib/bindings/

      - run: npm run tsc

  npm-lint:
    # 8 cores for the extra memory: the type-aware lint needs more heap
    # (--max-old-space-size=4096) than the 2-core profile's RAM can hold.
    runs-on: namespace-profile-ubuntu-8-cores
    needs: build-wasm

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Copy prepared wasm
        run: |
          ls -R prepared-wasm
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public
          mkdir rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg

      - name: Copy prepared ts-rs bindings
        run: |
          ls -R prepared-ts-rs-bindings
          mkdir rust/kcl-lib/bindings
          cp -r prepared-ts-rs-bindings/* rust/kcl-lib/bindings/

      # Type-aware linting holds the whole tsconfig program in memory, and its
      # peak heap sits right at Node's default ~2GB limit, causing flaky OOMs.
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  npm-circular-dependencies:
    runs-on: namespace-profile-ubuntu-2-cores
    needs: build-wasm

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Copy prepared wasm
        run: |
          ls -R prepared-wasm
          cp prepared-wasm/kcl_wasm_lib_bg.wasm public
          mkdir rust/kcl-wasm-lib/pkg
          cp prepared-wasm/kcl_wasm_lib* rust/kcl-wasm-lib/pkg

      - name: Copy prepared ts-rs bindings
        run: |
          ls -R prepared-ts-rs-bindings
          mkdir rust/kcl-lib/bindings
          cp -r prepared-ts-rs-bindings/* rust/kcl-lib/bindings/

      - run: npm run circular-deps:diff

  python-codespell:
    runs-on: namespace-profile-ubuntu-2-cores
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Run typos
        uses: crate-ci/typos@v1.49.0
