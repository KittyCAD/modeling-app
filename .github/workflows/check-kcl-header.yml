name: Check kcl-samples files for proper header structure

on:
  pull_request:
    paths:
      - 'public/kcl-samples/**/*.kcl'
      - .github/workflows/check-kcl-header.yml
    branches:
      - main
  push:
    paths:
      - 'public/kcl-samples/**/*.kcl'
      - .github/workflows/check-kcl-header.yml
    branches:
      - main

permissions:
  contents: read

jobs:
  check-kcl-header:
    runs-on: namespace-profile-ubuntu-2-cores
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check KCL files for header comment block and blank line
        run: |
          files=$(find public/kcl-samples -type f -name '*.kcl')
          failed_files=()

          for file in $files; do
            if ! awk '
              NR == 1 && $0 !~ /^\/\// { exit 1 }
              BEGIN { in_comment = 1 }
              NF == 0 && in_comment == 1 { in_comment = 0; next }
              $1 !~ /^\/\// && in_comment == 1 { exit 1 }
              in_comment == 0 && NF > 0 { exit 0 }
              END { if (in_comment == 1) exit 1 }
              ' "$file"; then
              failed_files+=("$file")
            fi
          done

          if [ ${#failed_files[@]} -ne 0 ]; then
            echo "One or more KCL files do not begin with a header comment block followed by a blank line:"
            printf '%s\n' "${failed_files[@]}"
            exit 1
          fi

      - name: Check KCL samples use current sketch syntax
        run: |
          deprecated_sketch_calls='(startSketchOn|startProfile|xLine|yLine|xLineTo|yLineTo|angledLine|angledLineOfXLength|angledLineOfYLength|angledLineThatIntersects|angledLineToX|angledLineToY|tangentialArc|close)[[:space:]]*\('
          positional_profile_calls='(circle|rectangle|polygon)[[:space:]]*\([[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*,'
          profile_pipe_calls='\|>[[:space:]]*(startProfile|line|xLine|yLine|xLineTo|yLineTo|angledLine|angledLineOfXLength|angledLineOfYLength|angledLineThatIntersects|angledLineToX|angledLineToY|arc|tangentialArc|circle|rectangle|polygon|close)[[:space:]]*\('

          if matches=$(grep -RInE --include='*.kcl' \
            -e "$deprecated_sketch_calls" \
            -e "$positional_profile_calls" \
            -e "$profile_pipe_calls" \
            public/kcl-samples); then
            echo 'Current KCL samples must use constraint-based sketch blocks and regions.'
            echo 'Move compatibility examples to public/kcl-samples-legacy.'
            echo "$matches"
            exit 1
          fi
