name: Check kcl-samples files for proper header structure

on:
  pull_request:
    paths:
      - 'public/kcl-samples/**/*.kcl'
      - .github/workflows/check-kcl-header.yml
    branches:
      - main
  push:
    paths:
      - 'public/kcl-samples/**/*.kcl'
      - .github/workflows/check-kcl-header.yml
    branches:
      - main

permissions:
  contents: read

jobs:
  check-kcl-header:
    runs-on: namespace-profile-ubuntu-2-cores
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check KCL file headers
        run: |
          files=$(find public/kcl-samples -type f -name '*.kcl')
          invalid_header_files=()

          for file in $files; do
            if ! awk '
              NR == 1 && $0 !~ /^\/\// { exit 1 }
              BEGIN { in_comment = 1 }
              NF == 0 && in_comment == 1 { in_comment = 0; next }
              $1 !~ /^\/\// && in_comment == 1 { exit 1 }
              in_comment == 0 && NF > 0 { exit 0 }
              END { if (in_comment == 1) exit 1 }
              ' "$file"; then
              invalid_header_files+=("$file")
            fi
          done

          if [ ${#invalid_header_files[@]} -ne 0 ]; then
            echo "One or more KCL files do not begin with a header comment block followed by a blank line:"
            printf '%s\n' "${invalid_header_files[@]}"
            exit 1
          fi

          missing_category_files=()

          for file in public/kcl-samples/*/main.kcl; do
            if ! awk 'NR == 3 && $0 ~ /^\/\/ Categories: [^[:space:]]/ { found = 1 } END { exit !found }' "$file"; then
              missing_category_files+=("$file")
            fi
          done

          if [ ${#missing_category_files[@]} -ne 0 ]; then
            echo "One or more KCL sample entry points do not have a non-empty '// Categories:' comment on line 3:"
            printf '%s\n' "${missing_category_files[@]}"
            exit 1
          fi
