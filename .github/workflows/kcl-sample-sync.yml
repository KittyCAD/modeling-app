name: Sync KCL samples for review

on:
  push:
    branches: [main]
    paths: ['public/kcl-samples/**']
  pull_request:
    paths:
      - public/kcl-samples/**
      - sample-sync/**
      - .github/workflows/kcl-sample-sync.yml
      - scripts/sync_kcl_samples.py
      - scripts/check_kcl_sample_ids.py
      - scripts/tests/test_sync_kcl_samples.py
      - scripts/kcl-sample-sync-state.mjs
  workflow_dispatch:
    inputs:
      target:
        description: Target API environment
        type: choice
        options: [development, production]
        default: development
      sample:
        description: Sample slug (use ALL for the entire catalog)
        default: wing-spar
        type: string
      apply:
        description: Upload and submit for review (otherwise validate offline)
        default: false
        type: boolean
      bootstrap_state:
        description: Migrate an existing checkpoint secret into a state PR (once only)
        default: false
        type: boolean
      initialize_state:
        description: First import into an empty account only; allow starting without a checkpoint
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: namespace-profile-ubuntu-2-cores
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate sample identities and test sync
        run: |
          python scripts/check_kcl_sample_ids.py
          python -m unittest discover -s scripts/tests -p 'test_*kcl_sample*.py'
          python scripts/sync_kcl_samples.py --samples-root public/kcl-samples

  targets:
    if: github.event_name != 'pull_request'
    runs-on: namespace-profile-ubuntu-2-cores
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/github-script@v8
        id: select
        env:
          TARGET: ${{ inputs.target }}
        with:
          script: |
            const targets = {
              development: {target: 'development', environment: 'staging'},
              production: {target: 'production', environment: 'Production'}
            };
            const selected = context.eventName === 'workflow_dispatch'
              ? [targets[process.env.TARGET]] : Object.values(targets);
            if (selected.some(t => !t)) throw new Error('Unknown sync target');
            core.setOutput('matrix', JSON.stringify({include: selected}));

  sync:
    needs: [validate, targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: kcl-sample-sync-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: namespace-profile-ubuntu-2-cores
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decide whether to upload
        id: mode
        env:
          APPLY: ${{ (github.event_name == 'push' && vars.KCL_SAMPLE_SYNC_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
          INITIALIZE_STATE: ${{ inputs.initialize_state }}
          BOOTSTRAP_STATE: ${{ inputs.bootstrap_state }}
          API_URL: ${{ vars.KCL_SAMPLE_SYNC_API_URL }}
          EXPECTED_API_URL: ${{ matrix.target == 'development' && 'https://api.dev.zoo.dev' || 'https://api.zoo.dev' }}
        shell: bash
        run: |
          if [[ "$APPLY" == true ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo 'Uploads must run from main; other branches can validate offline.' >&2
              exit 1
            fi
            if [[ "$API_URL" != "$EXPECTED_API_URL" ]]; then
              echo 'The configured API URL does not match the selected environment.' >&2
              exit 1
            fi
            if [[ "$INITIALIZE_STATE" == true && "$BOOTSTRAP_STATE" == true ]]; then
              echo 'Choose checkpoint bootstrap or an empty initial import, not both.' >&2
              exit 1
            fi
          fi
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
      - name: Restore this environment's committed checkpoint
        if: steps.mode.outputs.apply == 'true'
        id: checkpoint
        uses: actions/github-script@v8
        env:
          TARGET: ${{ matrix.target }}
          INITIALIZE_STATE: ${{ inputs.initialize_state }}
          BOOTSTRAP_STATE: ${{ inputs.bootstrap_state }}
          BOOTSTRAP_CONTENT: ${{ secrets.KCL_SAMPLE_SYNC_BOOTSTRAP_STATE }}
        with:
          script: |
            const fs = require('node:fs');
            const { restoreCheckpoint } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/kcl-sample-sync-state.mjs`);
            const checkpoint = await restoreCheckpoint({
              github, repo: context.repo, target: process.env.TARGET,
              initialize: process.env.INITIALIZE_STATE === 'true',
              bootstrap: process.env.BOOTSTRAP_STATE === 'true' ? process.env.BOOTSTRAP_CONTENT : undefined,
            });
            fs.mkdirSync('checkpoint', { recursive: true });
            fs.writeFileSync('checkpoint/baseline.json', JSON.stringify(checkpoint));
            if (checkpoint.content !== null) {
              fs.writeFileSync('checkpoint/sample-sync-state.json', checkpoint.content);
            } else {
              fs.rmSync('checkpoint/sample-sync-state.json', { force: true });
            }
      - name: Check credentials for the checkpoint PR
        if: steps.mode.outputs.apply == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MODELING_APP_GH_APP_ID }}
          private-key: ${{ secrets.MODELING_APP_GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Sync selected samples
        id: sync
        env:
          ZOO_API_TOKEN: ${{ secrets.ZOO_SAMPLE_SYNC_TOKEN }}
          API_URL: ${{ vars.KCL_SAMPLE_SYNC_API_URL }}
          SAMPLE: ${{ inputs.sample || 'ALL' }}
          APPLY: ${{ steps.mode.outputs.apply }}
          INITIALIZE_STATE: ${{ inputs.initialize_state }}
        shell: bash
        run: |
          args=(--samples-root public/kcl-samples --state checkpoint/sample-sync-state.json)
          if [[ "$SAMPLE" == ALL ]]; then
            args+=(--all)
          else
            args+=(--sample "$SAMPLE")
          fi
          if [[ "$APPLY" == true ]]; then
            args+=(--apply --api-url "$API_URL")
            if [[ "$INITIALIZE_STATE" == true ]]; then
              args+=(--initialize-state)
            fi
          fi
          python scripts/sync_kcl_samples.py "${args[@]}"
      - name: Get a fresh token for the checkpoint PR
        if: always() && steps.mode.outputs.apply == 'true' && steps.checkpoint.outcome == 'success' && steps.sync.outcome != 'skipped'
        id: checkpoint-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MODELING_APP_GH_APP_ID }}
          private-key: ${{ secrets.MODELING_APP_GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Propose this environment's checkpoint after partial failures too
        if: always() && steps.mode.outputs.apply == 'true' && steps.checkpoint.outcome == 'success' && steps.sync.outcome != 'skipped'
        uses: actions/github-script@v8
        env:
          TARGET: ${{ matrix.target }}
          SYNC_SUCCEEDED: ${{ steps.sync.outcome == 'success' }}
        with:
          github-token: ${{ steps.checkpoint-token.outputs.token || github.token }}
          script: |
            const fs = require('node:fs');
            const { proposeCheckpoint, STATE_BRANCH, statePath } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/kcl-sample-sync-state.mjs`);
            const filename = 'checkpoint/sample-sync-state.json';
            const content = fs.existsSync(filename) ? fs.readFileSync(filename, 'utf8') : null;
            try {
              const url = await proposeCheckpoint({
                github, repo: context.repo, target: process.env.TARGET,
                sourceSha: context.sha,
                runId: context.runId, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
                runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                checkpoint: JSON.parse(fs.readFileSync('checkpoint/baseline.json', 'utf8')),
                content, syncSucceeded: process.env.SYNC_SUCCEEDED === 'true',
              });
              if (url) core.info(`Checkpoint PR: ${url}`);
            } catch (error) {
              // State contains IDs, revisions, hashes, and paths, never API tokens.
              await core.summary
                .addHeading('Sample sync checkpoint PR could not be created')
                .addRaw(`Recover this checkpoint into ${STATE_BRANCH}:${statePath(process.env.TARGET)} through a PR before another upload.\n`)
                .addCodeBlock(content ?? '{}', 'json')
                .write();
              throw error;
            }
