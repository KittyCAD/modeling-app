name: kcl-python-bindings
on:
  push:
    branches:
      - main
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/rust-toolchain.toml'
      - 'rust/kcl-python-bindings/**'
      - '**.rs'
      - .github/workflows/kcl-python-bindings.yml
    tags:
      - 'kcl-*'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/rust-toolchain.toml'
      - 'rust/kcl-python-bindings/**'
      - '**.rs'
      - .github/workflows/kcl-python-bindings.yml
  workflow_dispatch:
  schedule:
    - cron: 0 * * * * # hourly
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  linux-x86_64:
    name: kcl-python-bindings (linux-x86_64)
    runs-on: namespace-profile-ubuntu-8-cores
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .tool-versions
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # The workspace sets `[profile.release] debug = true`, but no wheel
          # ships debug info: Linux embeds DWARF in the .so and --strip removes
          # it, while mac and Windows write it to .dSYM and .pdb sidecars that
          # are not packaged. Generating it costs build time for output that is
          # then discarded.
          CARGO_PROFILE_RELEASE_DEBUG: '0'
        with:
          working-directory: rust/kcl-python-bindings
          target: x86_64
          # --strip is a backstop. Without it a debug .so exceeds PyPI's 100MB
          # limit.
          args: --release --out dist --find-interpreter --strip
          sccache: 'true'
          manylinux: auto
          before-script-linux: |
            yum install openssl-devel -y
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: rust/kcl-python-bindings/dist
  windows:
    name: kcl-python-bindings (windows)
    runs-on: namespace-profile-windows-8-cores
    strategy:
      matrix:
        target:
          - x64
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          # Same reason as the macos job: install the set instead of letting
          # the runner image decide what gets published.
          python-version: |
            3.11
            3.12
            3.13
            3.14
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # See the linux job.
          CARGO_PROFILE_RELEASE_DEBUG: '0'
        with:
          working-directory: rust/kcl-python-bindings
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --strip
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: rust/kcl-python-bindings/dist
  macos:
    name: kcl-python-bindings (macos)
    runs-on: namespace-profile-macos-6-cores
    strategy:
      matrix:
        target:
          - aarch64
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          # `--find-interpreter` builds a wheel for every interpreter it finds,
          # so the runner image would otherwise decide what gets published.
          # This image carries 3.13 and 3.14; GitHub's carried 3.11 to 3.14.
          # Installing the set makes it the same on any image.
          python-version: |
            3.11
            3.12
            3.13
            3.14
      - name: Install sccache
        uses: taiki-e/install-action@sccache
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # maturin-action sets these itself when its own `sccache` input is
          # on. They are set here because that input is off.
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
          # See the linux job.
          CARGO_PROFILE_RELEASE_DEBUG: '0'
        with:
          working-directory: rust/kcl-python-bindings
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --strip
          # Off because maturin-action installs sccache with
          # `python3 -m pip install`, which this image's Homebrew Python
          # refuses under PEP 668. The step above installs it instead.
          sccache: 'false'
      - name: sccache stats
        # maturin-action prints these itself only when its own `sccache` input
        # is on.
        if: always()
        run: sccache --show-stats
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: rust/kcl-python-bindings/dist
  test:
    name: kcl-python-bindings (test)
    runs-on: namespace-profile-ubuntu-8-cores
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Track setup
        run: .github/ci-cd-scripts/track-step.sh
        env:
          TAB_API_URL: ${{ vars.TAB_API_URL }}
          TAB_API_KEY: ${{ secrets.TAB_API_KEY }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SUITE: integration:kcl
          CI_STEP: setup
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          rustflags: '' # Use .cargo/config.toml
      - uses: taiki-e/install-action@just
      - name: Track start
        run: .github/ci-cd-scripts/track-step.sh
        env:
          TAB_API_URL: ${{ vars.TAB_API_URL }}
          TAB_API_KEY: ${{ secrets.TAB_API_KEY }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SUITE: integration:kcl
          CI_STEP: start
      - name: Run tests
        run: |
          cd rust/kcl-python-bindings
          just setup-uv
          just test || true # let TAB determine failure
          ../../.github/ci-cd-scripts/upload-results.sh
        env:
          ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          ZOO_HOST: https://api.dev.zoo.dev
          TAB_API_URL: ${{ vars.TAB_API_URL }}
          TAB_API_KEY: ${{ secrets.TAB_API_KEY }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SUITE: integration:kcl
  sdist:
    name: kcl-python-bindings (sdist)
    runs-on: namespace-profile-ubuntu-8-cores
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Create venv
        run: |
          uv venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          uv pip install pip --upgrade
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/kcl-python-bindings
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: rust/kcl-python-bindings/dist
  release:
    name: Release
    runs-on: namespace-profile-ubuntu-8-cores
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-x86_64, windows, macos, sdist]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          path: rust/kcl-python-bindings
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: do uv things
        run: |
          cd rust/kcl-python-bindings
          uv venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          uv pip install pip --upgrade
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          working-directory: rust/kcl-python-bindings
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
