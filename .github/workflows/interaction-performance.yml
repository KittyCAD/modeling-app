name: Interaction performance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: interaction-performance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wasm:
    uses: ./.github/workflows/build-wasm.yml

  build-app:
    needs: build-wasm
    runs-on: namespace-profile-ubuntu-8-cores;overrides.cache-tag=modeling-app-general-v2
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: prepared-wasm
          path: rust/kcl-wasm-lib/pkg

      - uses: actions/download-artifact@v8
        with:
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings

      - name: Build production Electron application
        run: |
          cp rust/kcl-wasm-lib/pkg/kcl_wasm_lib_bg.wasm public/
          npm run tronb:vite:prod
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_INTERACTION_PERFORMANCE: '1'

      - uses: actions/upload-artifact@v7
        with:
          name: interaction-performance-build
          path: .vite/
          include-hidden-files: true
          retention-days: 7

  measure:
    name: Interaction performance budgets
    needs: build-app
    # A failed dependency must fail this check instead of leaving it skipped.
    if: ${{ !cancelled() }}
    # Use the established macOS desktop runner for normal Electron presentation.
    # Keep compilation separate and score one browser at a time.
    runs-on: namespace-profile-macos-8-cores
    timeout-minutes: 15
    steps:
      - name: Require instrumented build
        env:
          BUILD_RESULT: ${{ needs.build-app.result }}
        run: test "$BUILD_RESULT" = success

      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: interaction-performance-build
          path: .vite

      - uses: actions/download-artifact@v8
        with:
          name: prepared-wasm
          path: rust/kcl-wasm-lib/pkg

      - uses: actions/download-artifact@v8
        with:
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings

      - name: Enforce interaction budgets
        run: env -u HEADLESS npm exec -- playwright test --config=playwright.performance.config.ts --headed
        env:
          NODE_ENV: production
          TARGET: desktop
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          TAB_API_URL: ${{ vars.TAB_API_URL }}
          TAB_API_KEY: ${{ secrets.TAB_API_KEY }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Preserve measurements and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: interaction-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/interaction-performance/
            playwright-report/interaction-performance/
          if-no-files-found: error
          retention-days: 30
