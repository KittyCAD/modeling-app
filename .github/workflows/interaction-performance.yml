name: Interaction presentation diagnostics

on:
  workflow_dispatch:

concurrency:
  group: interaction-performance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  measure:
    name: Presentation traces (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, composite, shadowless, ganesh]
    runs-on: namespace-profile-macos-8-cores
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          # Reuse the exact app build from the failed native calibration.
          run-id: 35905169130
          github-token: ${{ github.token }}
          name: interaction-performance-build
          path: .vite

      - uses: actions/download-artifact@v8
        with:
          # Reuse the exact app build from the failed native calibration.
          run-id: 35905169130
          github-token: ${{ github.token }}
          name: prepared-wasm
          path: rust/kcl-wasm-lib/pkg

      - uses: actions/download-artifact@v8
        with:
          # Reuse the exact app build from the failed native calibration.
          run-id: 35905169130
          github-token: ${{ github.token }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings

      - name: Capture first-use presentation traces
        run: env -u HEADLESS npm exec -- playwright test --config=playwright.performance.config.ts --headed
        env:
          INTERACTION_DIAGNOSTIC_VARIANT: ${{ matrix.variant }}
          NODE_ENV: production
          TARGET: desktop
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Preserve measurements and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: interaction-performance-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/interaction-performance/
            playwright-report/interaction-performance/
          if-no-files-found: error
          retention-days: 30
