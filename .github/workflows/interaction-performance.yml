name: Interaction presentation diagnostics

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Diagnostic evidence to capture
        type: choice
        default: both
        options:
          - both
          - cloud
          - animation
          - palette-reduction
          - file-loader
          - targeted
          - comparison
      palette-frame-observer:
        description: Collect extra palette animation-frame observations
        type: boolean
        default: true
      cloud-creation-gate:
        description: Start cloud creation immediately or after the real project list arrives
        type: choice
        default: baseline
        options:
          - baseline
          - project-list-response

concurrency:
  group: interaction-performance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  measure:
    if: ${{ inputs.diagnostic == 'both' || inputs.diagnostic == 'animation' }}
    name: Presentation traces (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [animation]
    runs-on: namespace-profile-macos-8-cores
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          # Reuse the exact d5328e2c app build from PR CI.
          run-id: 35916061567
          github-token: ${{ github.token }}
          name: interaction-performance-build
          path: .vite

      - uses: actions/download-artifact@v8
        with:
          # Reuse the exact d5328e2c app build from PR CI.
          run-id: 35916061567
          github-token: ${{ github.token }}
          name: prepared-wasm
          path: rust/kcl-wasm-lib/pkg

      - uses: actions/download-artifact@v8
        with:
          # Reuse the exact d5328e2c app build from PR CI.
          run-id: 35916061567
          github-token: ${{ github.token }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings

      - name: Capture five first-use animation witnesses
        run: env -u HEADLESS npm exec -- playwright test --config=playwright.performance.config.ts --headed
        env:
          INTERACTION_DIAGNOSTIC_VARIANT: ${{ matrix.variant }}
          INTERACTION_DIAGNOSTIC_BUILD_RUN: 35916061567
          NODE_ENV: production
          TARGET: desktop
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Preserve compact measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: interaction-measurements-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/interaction-performance/playwright.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve measurements and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: interaction-performance-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/interaction-performance/playwright.json
            test-results/interaction-performance/**/presentation-trace.json
            test-results/interaction-performance/**/error-context.md
          if-no-files-found: error
          retention-days: 30

  cloud-timing:
    if: ${{ inputs.diagnostic == 'both' || inputs.diagnostic == 'cloud' || inputs.diagnostic == 'comparison' }}
    name: Cloud creation timing diagnosis
    runs-on: namespace-profile-macos-8-cores
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Ensure Chrome is available
        timeout-minutes: 4
        run: |
          if [ ! -d "/Applications/Google Chrome.app" ]; then
            npm exec -- playwright install chrome
          fi
      - name: Trace real project creation without retries
        timeout-minutes: 5
        run: env -u HEADLESS npm exec -- playwright test --config=playwright.cloud-diagnostic.config.ts --headed
        env:
          TARGET: web
          PLAYWRIGHT_CLOUD_CREATION_GATE: ${{ inputs.cloud-creation-gate }}
          NODE_ENV: development
          VERCEL_BASE_URL: https://modeling-m4vci3y8o.vercel.dev.zoo.dev
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
      - name: Preserve cloud timing evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cloud-creation-timings-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/cloud-timing-diagnostic/report.json
            test-results/cloud-timing-diagnostic/**/timings/events.jsonl
            test-results/cloud-timing-diagnostic/**/timings/cpu-profile.json
          if-no-files-found: error
          retention-days: 7

  palette-reduction:
    if: ${{ inputs.diagnostic == 'palette-reduction' || inputs.diagnostic == 'targeted' || inputs.diagnostic == 'comparison' }}
    name: Standalone palette presentation
    runs-on: namespace-profile-macos-8-cores
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          run-id: 35916061567
          github-token: ${{ github.token }}
          name: interaction-performance-build
          path: .vite
      - name: Build the standalone presentation from captured markup and app styles
        run: node e2e/performance/palette-reduction/build.cjs
      - name: Measure five first-use renderers without the business application
        timeout-minutes: 5
        run: env -u HEADLESS npm exec -- playwright test --config=playwright.palette-reduction.config.ts --headed
        env:
          PALETTE_REDUCTION_FRAME_OBSERVER: ${{ inputs.palette-frame-observer }}
      - name: Preserve reduction evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: palette-reduction-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/palette-reduction/playwright.json
            test-results/palette-reduction-build/metadata.json
          if-no-files-found: error
          retention-days: 7

  file-loader:
    if: ${{ inputs.diagnostic == 'file-loader' || inputs.diagnostic == 'targeted' }}
    name: Windows cloud file-loader waits
    runs-on: namespace-profile-windows-8-cores
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          run-id: 35920252389
          github-token: ${{ github.token }}
          name: prepared-wasm
          path: rust/kcl-wasm-lib/pkg
      - uses: actions/download-artifact@v8
        with:
          run-id: 35920252389
          github-token: ${{ github.token }}
          name: prepared-ts-rs-bindings
          path: rust/kcl-lib/bindings
      - name: Copy the browser Wasm asset
        run: Copy-Item rust/kcl-wasm-lib/pkg/kcl_wasm_lib_bg.wasm public/kcl_wasm_lib_bg.wasm
      - name: Install the existing Chrome test browser
        run: npm exec -- playwright install chrome
      - name: Capture the existing first-upload flow without retries
        timeout-minutes: 5
        run: npm exec -- playwright test --config=playwright.cloud-loader-diagnostic.config.ts --headed
        env:
          TARGET: web
          NODE_ENV: development
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
      - name: Preserve file-loader evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cloud-file-loader-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/cloud-loader-diagnostic/results/**/file-loader-spans.json
          if-no-files-found: error
          retention-days: 7
