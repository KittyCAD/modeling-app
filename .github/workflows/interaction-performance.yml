name: Interaction performance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      calibration-fault:
        description: Calibrate the dispatched commit against itself, optionally adding 64 ms to candidate Home palette opening
        type: choice
        default: none
        options: [none, first, warm, stall]

concurrency:
  group: interaction-performance-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Revoke the cache token's read/write capabilities, including for manual runs.
cache-mode: none

jobs:
  resolve:
    # Selected application refs must not update caches used by other workflows.
    runs-on: namespace-profile-ubuntu-2-cores;overrides.cache-tag=interaction-${{ github.run_id }}-${{ github.run_attempt }}-resolve
    outputs:
      base_commit: ${{ steps.plan.outputs.base_commit }}
      candidate_commit: ${{ steps.plan.outputs.candidate_commit }}
      pr_head_commit: ${{ steps.plan.outputs.pr_head_commit }}
      harness_commit: ${{ steps.plan.outputs.harness_commit }}
      harness_source: ${{ steps.plan.outputs.harness_source }}
      harness_variant: ${{ steps.plan.outputs.harness_variant }}
      calibration_fault: ${{ steps.plan.outputs.calibration_fault }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify build manifest producer and consumer
        run: node --test e2e/performance/build-comparison.node-test.cjs
      - name: Resolve immutable application and harness commits
        id: plan
        run: node e2e/performance/build-comparison.cjs resolve .
      - uses: actions/upload-artifact@v7
        with:
          name: interaction-comparison-plan
          path: comparison-plan.json
          if-no-files-found: error
          retention-days: 30

  build-wasm:
    needs: resolve
    runs-on: namespace-profile-ubuntu-8-cores;overrides.cache-tag=interaction-${{ github.run_id }}-${{ github.run_attempt }}-wasm-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          persist-credentials: false
          ref: ${{ matrix.commit }}
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .performance-pipeline
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Use correct Rust toolchain
        run: |
          [ -e rust-toolchain.toml ] || cp rust/rust-toolchain.toml ./
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false
          rustflags: "" # use .cargo/config.toml
      - uses: taiki-e/install-action@c30ba1cbe2face7f695d394a2c95af204d417b29
        with:
          tool: wasm-pack
      - name: Build Wasm and committed TypeScript bindings
        run: |
          cargo fetch --locked --manifest-path rust/Cargo.toml
          npm run build:wasm
      - name: Record Wasm provenance and reject lockfile drift
        run: node .performance-pipeline/e2e/performance/build-comparison.cjs wasm .
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-wasm-interaction-${{ matrix.variant }}
          path: |
            rust/kcl-wasm-lib/pkg/kcl_wasm_lib*
            rust/kcl-wasm-lib/pkg/interaction-wasm-manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-ts-rs-bindings-interaction-${{ matrix.variant }}
          path: rust/kcl-lib/bindings/*
          if-no-files-found: error
          retention-days: 7

  build-app:
    needs: [resolve, build-wasm]
    runs-on: namespace-profile-ubuntu-8-cores;overrides.cache-tag=interaction-${{ github.run_id }}-${{ github.run_attempt }}-app-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          persist-credentials: false
          ref: ${{ matrix.commit }}
          path: app
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: app
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.harness_commit }}
          path: harness
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: harness
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: app/.nvmrc
          package-manager-cache: false
      - run: npm ci
        working-directory: app
      - uses: actions/download-artifact@v8
        with:
          name: interaction-comparison-plan
          path: provenance
      - uses: actions/download-artifact@v8
        with:
          name: prepared-wasm-interaction-${{ matrix.variant }}
          path: app/rust/kcl-wasm-lib/pkg
      - uses: actions/download-artifact@v8
        with:
          name: prepared-ts-rs-bindings-interaction-${{ matrix.variant }}
          path: app/rust/kcl-lib/bindings
      - name: Apply identical test instrumentation to this application
        run: node harness/e2e/performance/build-comparison.cjs prepare app harness provenance/comparison-plan.json "$VARIANT"
        env:
          VARIANT: ${{ matrix.variant }}
      - name: Build production Electron application
        working-directory: app
        run: |
          cp rust/kcl-wasm-lib/pkg/kcl_wasm_lib_bg.wasm public/
          npm run tronb:vite:prod
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ matrix.commit }}
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_INTERACTION_PERFORMANCE: "1"
      - name: Record source, workload, dependencies, and build hashes
        run: node harness/e2e/performance/build-comparison.cjs manifest app harness provenance/comparison-plan.json "$VARIANT"
        env:
          VARIANT: ${{ matrix.variant }}
      - uses: actions/upload-artifact@v7
        with:
          name: interaction-performance-build-${{ matrix.variant }}
          path: |
            app/.vite/
            app/interaction-build-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  measure:
    name: Interaction performance regression
    needs: [resolve, build-wasm, build-app]
    # A failed dependency must fail this check instead of leaving it skipped.
    if: ${{ !cancelled() }}
    runs-on: namespace-profile-macos-8-cores;overrides.cache-tag=interaction-${{ github.run_id }}-${{ github.run_attempt }}-measure
    timeout-minutes: 15
    steps:
      - name: Require both instrumented builds
        env:
          PLAN_RESULT: ${{ needs.resolve.result }}
          WASM_RESULT: ${{ needs.build-wasm.result }}
          BUILD_RESULT: ${{ needs.build-app.result }}
        run: test "$PLAN_RESULT" = success && test "$WASM_RESULT" = success && test "$BUILD_RESULT" = success
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.base_commit }}
          path: apps/base
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: apps/base
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.candidate_commit }}
          path: apps/candidate
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: apps/candidate
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: apps/base/.nvmrc
          package-manager-cache: false
      - run: npm ci
        working-directory: apps/base
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: apps/candidate/.nvmrc
          package-manager-cache: false
      - run: npm ci
        working-directory: apps/candidate
      # Node/Playwright belong to the selected harness; each app launches its own Electron.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: apps/${{ needs.resolve.outputs.harness_variant }}/.nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: interaction-comparison-plan
          path: provenance
      - uses: actions/download-artifact@v8
        with:
          name: interaction-performance-build-base
          path: apps/base
      - uses: actions/download-artifact@v8
        with:
          name: interaction-performance-build-candidate
          path: apps/candidate
      - uses: actions/download-artifact@v8
        with:
          name: prepared-wasm-interaction-base
          path: apps/base/rust/kcl-wasm-lib/pkg
      - uses: actions/download-artifact@v8
        with:
          name: prepared-wasm-interaction-candidate
          path: apps/candidate/rust/kcl-wasm-lib/pkg
      - uses: actions/download-artifact@v8
        with:
          name: prepared-ts-rs-bindings-interaction-base
          path: apps/base/rust/kcl-lib/bindings
      - uses: actions/download-artifact@v8
        with:
          name: prepared-ts-rs-bindings-interaction-candidate
          path: apps/candidate/rust/kcl-lib/bindings
      - name: Verify both applications against the selected harness
        env:
          HARNESS_VARIANT: ${{ needs.resolve.outputs.harness_variant }}
        run: |
          HARNESS_DIR="$GITHUB_WORKSPACE/apps/$HARNESS_VARIANT"
          node "$HARNESS_DIR/e2e/performance/build-comparison.cjs" verify-pair apps/base apps/candidate provenance/comparison-plan.json
      - name: Compare native interaction performance
        working-directory: apps/${{ needs.resolve.outputs.harness_variant }}
        run: env -u HEADLESS npm exec -- playwright test --config=playwright.performance.config.ts --headed
        env:
          NODE_ENV: production
          TARGET: desktop
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          TAB_API_URL: ${{ vars.TAB_API_URL }}
          TAB_API_KEY: ${{ secrets.TAB_API_KEY }}
          CI_COMMIT_SHA: ${{ needs.resolve.outputs.pr_head_commit || needs.resolve.outputs.candidate_commit }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          INTERACTION_BASE_APP_DIR: ${{ github.workspace }}/apps/base
          INTERACTION_CANDIDATE_APP_DIR: ${{ github.workspace }}/apps/candidate
          INTERACTION_BASE_COMMIT: ${{ needs.resolve.outputs.base_commit }}
          INTERACTION_CANDIDATE_COMMIT: ${{ needs.resolve.outputs.candidate_commit }}
          INTERACTION_PR_HEAD_COMMIT: ${{ needs.resolve.outputs.pr_head_commit }}
          INTERACTION_HARNESS_COMMIT: ${{ needs.resolve.outputs.harness_commit }}
          INTERACTION_HARNESS_SOURCE: ${{ needs.resolve.outputs.harness_source }}
          INTERACTION_CALIBRATION_FAULT: ${{ needs.resolve.outputs.calibration_fault }}
      # A successful comparison does not establish A/A noise or fault-injection calibration.
      - name: Preserve measurements, provenance, and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: interaction-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            provenance/comparison-plan.json
            apps/*/interaction-build-manifest.json
            apps/*/test-results/interaction-performance/
            apps/*/playwright-report/interaction-performance/
          if-no-files-found: error
          retention-days: 30
