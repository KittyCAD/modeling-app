name: kcl-wasm-lib-build-and-publish

on:
  push:
    tags:
      - "kcl-*"

permissions:
  id-token: write
  contents: write

jobs:
  publish-kcl-wasm-lib:
    name: kcl-wasm-lib-build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          # node 24 fixed OIDC npm publishing; Node 26 seems to have an issue with electron/build and
          # it's dependency on yargs
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"

      - run: npm install

      - name: Use correct Rust toolchain
        shell: bash
        run: |
          [ -e rust-toolchain.toml ] || cp rust/rust-toolchain.toml ./

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false
          rustflags: ""

      - uses: taiki-e/install-action@c30ba1cbe2face7f695d394a2c95af204d417b29
        with:
          tool: wasm-pack

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Wasm
        run: npm run build:wasm

      - name: Check if version changed
        id: version_check
        working-directory: rust/kcl-wasm-lib/pkg
        run: |
          package_name=$(jq -r .name package.json)
          local_version=$(jq -r .version package.json)
          published_version=$(npm view "$package_name" version 2>/dev/null || true)

          echo "local_version=$local_version" >> "$GITHUB_OUTPUT"
          echo "published_version=$published_version" >> "$GITHUB_OUTPUT"

          if [ "$local_version" = "$published_version" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged; skipping publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version changed from '$published_version' to '$local_version'."
          fi

      - name: Publish package
        if: ${{ steps.version_check.outputs.should_publish == 'true' }}
        working-directory: rust/kcl-wasm-lib/pkg
        run: |
          npm pkg fix
          npm publish --access public --provenance

      - name: Create viewer repository token
        if: ${{ steps.version_check.outputs.should_publish == 'true' }}
        id: viewer_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MODELING_APP_GH_APP_ID }}
          private-key: ${{ secrets.MODELING_APP_GH_APP_PRIVATE_KEY }}
          owner: KittyCAD
          repositories: viewer

      - name: Check out viewer
        if: ${{ steps.version_check.outputs.should_publish == 'true' }}
        uses: actions/checkout@v7.0.1
        with:
          repository: KittyCAD/viewer
          ref: main
          path: viewer
          token: ${{ steps.viewer_token.outputs.token }}

      - name: Update viewer KCL Wasm dependency
        if: ${{ steps.version_check.outputs.should_publish == 'true' }}
        working-directory: viewer
        env:
          VERSION: ${{ steps.version_check.outputs.local_version }}
        run: |
          npm install "@kittycad/kcl-wasm-lib@$VERSION" --package-lock-only --ignore-scripts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Update kcl-wasm-lib to $VERSION"
          git push origin main
