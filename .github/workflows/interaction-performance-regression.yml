name: Interaction performance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: interaction-performance-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

cache-mode: none

jobs:
  resolve:
    # Selected application refs must not update caches used by other workflows.
    runs-on: namespace-profile-ubuntu-2-cores;overrides.cache-tag=interaction-${{ github.run_id }}-${{ github.run_attempt }}-resolve
    outputs:
      base_commit: ${{ steps.plan.outputs.base_commit }}
      candidate_commit: ${{ steps.plan.outputs.candidate_commit }}
      pr_head_commit: ${{ steps.plan.outputs.pr_head_commit }}
      harness_commit: ${{ steps.plan.outputs.harness_commit }}
      harness_source: ${{ steps.plan.outputs.harness_source }}
      harness_variant: ${{ steps.plan.outputs.harness_variant }}
      calibration_fault: ${{ steps.plan.outputs.calibration_fault }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify build manifest producer and consumer
        run: node --test e2e/performance/build-comparison.node-test.cjs
      - name: Resolve immutable application and harness commits
        id: plan
        run: node e2e/performance/build-comparison.cjs resolve .
      - uses: actions/upload-artifact@v7
        with:
          name: interaction-comparison-plan
          path: comparison-plan.json
          if-no-files-found: error
          retention-days: 30

  build-wasm:
    needs: resolve
    runs-on: namespace-profile-ubuntu-8-cores;overrides.cache-tag=interaction-${{ github.run_id }}-${{ github.run_attempt }}-wasm-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.commit }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .performance-pipeline
      - uses: ./.performance-pipeline/.github/actions/interaction-build-wasm
        with:
          variant: ${{ matrix.variant }}

  build-app:
    needs: [resolve, build-wasm]
    runs-on: namespace-profile-ubuntu-8-cores;overrides.cache-tag=interaction-${{ github.run_id }}-${{ github.run_attempt }}-app-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.commit }}
          path: app
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.harness_commit }}
          path: harness
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .performance-pipeline
      - uses: ./.performance-pipeline/.github/actions/interaction-build-app
        with:
          variant: ${{ matrix.variant }}
          commit: ${{ matrix.commit }}

  measure:
    name: Interaction performance regression
    needs: [resolve, build-wasm, build-app]
    # A failed dependency must fail this check instead of leaving it skipped.
    if: ${{ !cancelled() }}
    runs-on: namespace-profile-macos-8-cores;overrides.cache-tag=interaction-${{ github.run_id }}-${{ github.run_attempt }}-measure
    timeout-minutes: 15
    steps:
      - name: Require both instrumented builds
        env:
          PLAN_RESULT: ${{ needs.resolve.result }}
          WASM_RESULT: ${{ needs.build-wasm.result }}
          BUILD_RESULT: ${{ needs.build-app.result }}
        run: test "$PLAN_RESULT" = success && test "$WASM_RESULT" = success && test "$BUILD_RESULT" = success
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.base_commit }}
          path: apps/base
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.candidate_commit }}
          path: apps/candidate
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .performance-pipeline
      - uses: ./.performance-pipeline/.github/actions/interaction-measure
        with:
          base-commit: ${{ needs.resolve.outputs.base_commit }}
          candidate-commit: ${{ needs.resolve.outputs.candidate_commit }}
          pr-head-commit: ${{ needs.resolve.outputs.pr_head_commit }}
          harness-commit: ${{ needs.resolve.outputs.harness_commit }}
          harness-source: ${{ needs.resolve.outputs.harness_source }}
          harness-variant: ${{ needs.resolve.outputs.harness_variant }}
          calibration-fault: ${{ needs.resolve.outputs.calibration_fault }}
          zoo-api-token: ${{ secrets.ZOO_API_TOKEN }}
          tab-api-url: ${{ vars.TAB_API_URL }}
          tab-api-key: ${{ secrets.TAB_API_KEY }}

  absolute-budget:
    name: Interaction performance 150 ms budget
    needs: [resolve, build-wasm]
    if: ${{ !cancelled() }}
    runs-on: namespace-profile-macos-8-cores;overrides.cache-tag=interaction-${{ github.run_id }}-${{ github.run_attempt }}-absolute
    timeout-minutes: 60
    steps:
      - name: Require the candidate Wasm build
        env:
          PLAN_RESULT: ${{ needs.resolve.result }}
          WASM_RESULT: ${{ needs.build-wasm.result }}
        run: test "$PLAN_RESULT" = success && test "$WASM_RESULT" = success
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.candidate_commit }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: prepared-wasm-interaction-candidate
          path: rust/kcl-wasm-lib/pkg
      - uses: actions/download-artifact@v8
        with:
          name: prepared-ts-rs-bindings-interaction-candidate
          path: rust/kcl-lib/bindings
      - name: Verify candidate Wasm provenance
        run: node -e 'require("./e2e/performance/build-comparison.cjs").verifyWasm(process.cwd(), process.env.CANDIDATE_COMMIT)'
        env:
          CANDIDATE_COMMIT: ${{ needs.resolve.outputs.candidate_commit }}
      # Paired builds intentionally use the base harness. Absolute checks need
      # the candidate's complete recorder, including newly registered actions.
      - name: Build candidate with its complete interaction recorder
        id: candidate-build
        run: |
          cp rust/kcl-wasm-lib/pkg/kcl_wasm_lib_bg.wasm public/
          npm run tronb:vite:prod
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ needs.resolve.outputs.candidate_commit }}
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_INTERACTION_PERFORMANCE: "1"
      - name: Install browser for absolute handoff checks
        run: npm exec -- playwright install chrome
      - name: Enforce every native interaction's 150 ms budget
        run: env -u HEADLESS npm exec -- playwright test --config=playwright.interaction-budget.config.ts --headed --max-failures=0
        env:
          NODE_ENV: production
          TARGET: desktop
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          INTERACTION_CANDIDATE_APP_DIR: ${{ github.workspace }}
      # Native latency debt must not prevent the browser case from running.
      - name: Enforce every browser interaction's 150 ms budget
        if: ${{ !cancelled() && steps.candidate-build.outcome == 'success' }}
        run: env -u HEADLESS npm exec -- playwright test --config=playwright.interaction-browser-budget.config.ts --headed --max-failures=0
        env:
          NODE_ENV: production
          TARGET: web
          VITE_ZOO_BASE_DOMAIN: dev.zoo.dev
          VITE_ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
      - name: Preserve absolute measurements and failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: interaction-absolute-budget-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/interaction-budget/
            test-results/interaction-browser-budget/
            playwright-report/interaction-budget/
            playwright-report/interaction-browser-budget/
            rust/kcl-wasm-lib/pkg/interaction-wasm-manifest.json
          if-no-files-found: error
          retention-days: 30
