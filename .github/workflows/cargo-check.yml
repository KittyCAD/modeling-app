on:
  push:
    branches:
      - main
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/rust-toolchain.toml'
      - '**.rs'
      - .github/workflows/cargo-check.yml
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: cargo check
permissions:
  contents: read
jobs:
  cargocheck:
    name: cargo check
    runs-on: namespace-profile-ubuntu-8-cores
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use correct Rust toolchain
        shell: bash
        run: |
          [ -e rust-toolchain.toml ] || cp rust/rust-toolchain.toml ./
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          # Caching is handled by the Namespace cache volume below. Enabling
          # both would store the same content twice, once through GitHub's
          # cache API and once on the volume.
          cache: false
          rustflags: '' # Use .cargo/config.toml
      - name: Rust cache on the Namespace volume
        # Probe: does namespace-profile-ubuntu-8-cores have a Cache Volume?
        # The same action failed on namespace-profile-ubuntu-2-cores with
        # "nscloud-cache-action requires a cache volume to be configured", but
        # that job runs inside an alpine container, so the profile and the
        # container were confounded. This job runs directly on the runner, so
        # the result answers the profile question on its own.
        #
        # Paths are explicit rather than `cache: rust`, because the
        # mode-to-path mapping is resolved on the runner and cannot be checked
        # beforehand, and this workspace is at `rust/` not the repository root.
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            rust/target
            ~/.cargo/registry
            ~/.cargo/git

      - name: Run check
        run: |
          cd rust
          # We specifically want to test the disable-println feature
          # Since it is not enabled by default, we need to specify it
          # This is used in kcl-lsp
          cargo check --workspace --features disable-println --features pyo3 --features cli
