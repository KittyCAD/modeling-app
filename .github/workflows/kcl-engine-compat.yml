name: KCL Engine compatibility

on:
  pull_request:
    paths:
      - "rust/Cargo.toml"
      - "rust/kcl-*/Cargo.toml"
      - "rust/Cargo.lock"
      - ".github/workflows/kcl-engine-compat.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  engine-compatibility:
    name: Engine accepts KCL release dependencies
    runs-on:
      - runs-on=${{ github.run_id }}
      - runner=16cpu-linux-x64
      - extras=s3-cache
    steps:
      - uses: runs-on/action@v2.3.1
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.MODELING_APP_GH_APP_ID }}
          private-key: ${{ secrets.MODELING_APP_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: KittyCAD/engine
          path: engine
          lfs: true
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Check every modeling command is implemented
        run: |
          echo "${{ steps.app-token.outputs.token }}" | docker login ghcr.io --username "${{ github.repository_owner }}" --password-stdin
          docker run --rm --interactive \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/engine \
            --env GITHUB_WORKSPACE=/workspace \
            ghcr.io/kittycad/cuda:12.1.1-zoo-devel-no-gpu-ubuntu22.04-main \
            bash -euxo pipefail -s <<'SCRIPT'
          git config --global --add safe.directory /workspace/engine
          rustup toolchain install
          sed -i 's|^# kcl-lib = .*|kcl-lib = { path = "../rust/kcl-lib" }|' Cargo.toml
          grep -F 'kcl-lib = { path = "../rust/kcl-lib" }' Cargo.toml
          cargo update -p kcl-lib
          cargo update -p kittycad-modeling-cmds
          cargo metadata --format-version 1 | grep -Fq '"manifest_path":"/workspace/rust/kcl-lib/Cargo.toml"'
          ENGINE_WORKING_DIR=$(pwd) cargo build --bin engine-api --features exhaustive-modeling-cmds
          SCRIPT
