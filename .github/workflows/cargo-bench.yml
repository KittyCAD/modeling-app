on:
  push:
    branches:
      - main
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/rust-toolchain.toml'
      - .github/workflows/cargo-bench.yml
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/rust-toolchain.toml'
      - .github/workflows/cargo-bench.yml
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: cargo bench
jobs:
  cargo-bench:
    name: cargo bench
    runs-on: ubuntu-latest
    # runs-on: namespace-profile-ubuntu-2-cores
    # TODO: Figure out if there is a way to make CodSpeed work with Namespace
    # Enabling this results in the following error on GitHub Actions:
    #   setarch: failed to set personality to x86_64: Operation not permitted
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use correct Rust toolchain
        shell: bash
        run: |
          [ -e rust-toolchain.toml ] || cp rust/rust-toolchain.toml ./
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          cache: false # Configured below, after the manifest is edited.
          rustflags: '' # Use .cargo/config.toml
      - name: Swap criterion for the CodSpeed compatibility layer
        # The version is pinned so the resolved lockfile is identical on every
        # run. The cache key below hashes Cargo.lock. An unpinned resolve would
        # change that key whenever CodSpeed publishes a release.
        run: |
          cd rust/kcl-lib
          cargo add --dev codspeed-criterion-compat@5.0.1 --rename criterion
      - name: Rust Cache
        # This step must follow the manifest edit above. The key is computed
        # from Cargo.toml and Cargo.lock as they exist on disk at this point,
        # and the build below runs against the edited dependency graph.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cargo-codspeed
        # Runs after the cache restore so a cached ~/.cargo/bin makes this a
        # no-op. cargo-codspeed is not available through taiki-e/install-action.
        run: cargo install cargo-codspeed
      - name: Build the benchmark target(s)
        run: |
          cd rust
          cargo codspeed build \
            --bench benchmark_kcl_samples \
            --bench compiler_benchmark_criterion \
            --bench digest_benchmark \
            --bench memory_benchmark_criterion
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5.0.3
        with:
          mode: simulation
          working-directory: rust
          run: >-
            cargo codspeed run
            --bench benchmark_kcl_samples
            --bench compiler_benchmark_criterion
            --bench digest_benchmark
            --bench memory_benchmark_criterion
          token: ${{ secrets.CODSPEED_TOKEN }}
        env:
          ZOO_API_TOKEN: ${{ secrets.ZOO_API_TOKEN }}
          ZOO_HOST: https://api.dev.zoo.dev
