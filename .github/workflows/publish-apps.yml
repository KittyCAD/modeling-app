name: publish-apps

on:
  release:
    types: [published] # each job below is restricted to 'v<M.N.P>' app tags

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  release-desktop:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: namespace-profile-ubuntu-2-cores
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Find tag workflow ID
        id: tag_workflow_id
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          id=$(gh run ls --repo kittycad/modeling-app -w build-apps.yml --branch "${RELEASE_TAG_NAME}" --json databaseId | jq '.[0].databaseId')
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: out-universal-windows
          path: out
          run-id: ${{ steps.tag_workflow_id.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: out-yml-windows
          path: out
          run-id: ${{ steps.tag_workflow_id.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: out-universal-macos
          path: out
          run-id: ${{ steps.tag_workflow_id.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: out-yml-macos
          path: out
          run-id: ${{ steps.tag_workflow_id.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: out-arm64-linux
          path: out
          run-id: ${{ steps.tag_workflow_id.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: out-x64-linux
          path: out
          run-id: ${{ steps.tag_workflow_id.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: out-yml-linux
          path: out
          run-id: ${{ steps.tag_workflow_id.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: out-download-json
          path: out
          run-id: ${{ steps.tag_workflow_id.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        run: ls -R out

      - name: Override release notes
        env:
          NOTES: ${{ github.event.release.body }}
        run: npm run files:set-notes

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v3.0.0'
        with:
          credentials_json: '${{ secrets.GOOGLE_CLOUD_DL_SA }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT_ID }}

      - name: Upload release files to public bucket
        uses: google-github-actions/upload-cloud-storage@v3.0.0
        with:
          path: out
          glob: '*'
          parent: false
          process_gcloudignore: false
          destination: 'dl.kittycad.io/releases/design-studio'

      - name: Invalidate bucket cache on latest*.yml and last_download.json files
        run: npm run files:invalidate-bucket

      - name: Upload release files to Github
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: 'out/Zoo*'

  release-web:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: namespace-profile-ubuntu-2-cores
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Sync production branch to release commit
        shell: bash
        run: |
          git checkout production || git checkout -b production
          git fetch origin
          git reset --hard "${{ github.sha }}"
          git push --force origin production

  release-kittycad-ts:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Read published KCL Wasm version
        id: wasm_version
        run: |
          version=$(npm view @kittycad/kcl-wasm-lib version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create kittycad.ts repository token
        id: kittycad_ts_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MODELING_APP_GH_APP_ID }}
          private-key: ${{ secrets.MODELING_APP_GH_APP_PRIVATE_KEY }}
          owner: KittyCAD
          repositories: kittycad.ts

      - name: Check out kittycad.ts
        uses: actions/checkout@v7.0.1
        with:
          repository: KittyCAD/kittycad.ts
          ref: main
          path: kittycad.ts
          token: ${{ steps.kittycad_ts_token.outputs.token }}

      - name: Update kittycad.ts KCL Wasm dependency
        working-directory: kittycad.ts
        env:
          VERSION: ${{ steps.wasm_version.outputs.version }}
        run: |
          npm install --save-exact "@kittycad/kcl-wasm-lib@$VERSION" --ignore-scripts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name zoo-github-actions-auth[bot]
          git config user.email zoo-github-actions-auth[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Update kcl-wasm-lib to $VERSION"

          npm version patch --no-git-tag-version
          version="$(jq -r '.version' package.json)"
          git add package.json package-lock.json
          git commit -m "Trigger release via version bump to $version"
          git fetch origin main
          upstream_version="$(git show origin/main:package.json | jq -r '.version')"
          if [ "$upstream_version" = "$version" ]; then
            echo "kittycad.ts $version is already upstream; skipping the push."
            exit 0
          fi
          git push origin main
          git tag "$version"
          git push origin "$version"

  announce-release:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: [release-desktop, release-web]
    runs-on: namespace-profile-ubuntu-2-cores
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .tool-versions

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Announce Release
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: python public/announce_release.py
