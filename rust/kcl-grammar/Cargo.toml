[package]
name = "kcl-grammar"
description = "Sentence grammars and a reference membership recognizer for KCL"
version = "0.2.198"
edition = "2024"
license = "MIT"
repository = "https://github.com/KittyCAD/modeling-app"
authors = ["KittyCAD, Inc"]
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
ignore = "0.4.34"
kcl-syntax = { version = "=0.2.198", path = "../kcl-syntax" }
lalrpop-util = { version = "=0.23.2", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
walkdir = "2.5"

[build-dependencies]
lalrpop = { version = "=0.23.2", default-features = false }

[dev-dependencies]
datatest-stable = "0.3.3"

[[test]]
name = "membership"
harness = false

[lints]
workspace = true
