[package]
name = "display-tessellation"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
kittycad-native-brep = { git = "https://github.com/KittyCAD/format", rev = "1db7c8e9504b99f3850d80a12a07db2153a2d836" }
serde_json.workspace = true
earcutr = "0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.99"
js-sys = "0.3.72"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
