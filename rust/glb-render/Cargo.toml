[package]
name = "glb-render"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kcl-render"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gltf = { git = "https://github.com/KittyCAD/gltf-rs", rev = "7e90eff77f296530e9573bd3680a742d740cde52", default-features = false, features = ["utils", "KITTYCAD_boundary_representation"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libm = "0.2.16"
nalgebra = { version = "0.35.0", default-features = false, features = ["std", "libm-force"] }

[dev-dependencies]
serde_json = { workspace = true }
